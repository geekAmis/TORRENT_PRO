<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torrent Pro | Admin Panel</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="glitch">ADMIN CONTROL</h1>
            <button class="btn" onclick="window.location.href='/'">Back to Dashboard</button>
        </header>

        <div class="dashboard-grid">
            
            <!-- Секция создания уровня -->
            <div class="card">
                <div class="card-header">
                    <h3>Create New Level</h3>
                </div>
                <div class="input-group">
                    <input type="text" id="lvl-name" placeholder="Level Name (e.g. VIP)">
                </div>
                <div class="input-group">
                    <input type="number" id="lvl-mb" placeholder="MB Limit" style="width:100%; background:#000; border:1px solid var(--border); color:var(--neon-cyan); padding:12px; font-family:inherit; outline:none;">
                </div>
                <div class="input-group">
                    <input type="number" id="lvl-torrent" placeholder="Torrent Limit" style="width:100%; background:#000; border:1px solid var(--border); color:var(--neon-cyan); padding:12px; font-family:inherit; outline:none;">
                </div>
                <button class="btn btn-full" onclick="createLevel()">Create Level</button>
            </div>

            <!-- Список пользователей -->
            <div class="card" style="grid-column: span 2;">
                <div class="card-header">
                    <h3>User Management</h3>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Email</th>
                                <th>Subscription</th>
                                <th>Files</th>
                                <th>Used MB</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body">
                            <!-- Загружается через JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Список уровней -->
            <div class="card" style="grid-column: span 2;">
                <div class="card-header">
                    <h3>Subscription Levels</h3>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>MB Limit</th>
                                <th>Torrent Limit</th>
                            </tr>
                        </thead>
                        <tbody id="levels-table-body">
                            <!-- Загружается через JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- Модальное окно смены подписки (упрощенно) -->
    <div id="sub-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:var(--panel); border:2px solid var(--neon-cyan); padding:30px; z-index:100; box-shadow: 0 0 50px #000;">
        <h3>Assign Subscription</h3>
        <p id="modal-user-email" style="color:var(--neon-magenta); font-size:0.8rem;"></p>
        <div id="levels-select-container" style="margin: 20px 0;"></div>
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-magenta" id="confirm-sub-btn">Apply</button>
    </div>

    <script src="/static/admin.js"></script>
</body>
</html>
